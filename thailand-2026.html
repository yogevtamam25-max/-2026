// ── ITINERARY ──
function renderItinerary() {
  const filterGroups = ["הכל","צ'אנג מאי","קוסמוי","פטאיה","בנגקוק"];
  const filtered = state.itinerary.filter(d => {
    if (state.filter==="all") return true;
    if (state.filter==="צ'אנג מאי") return d.location.includes("צ'אנג מאי")||d.location.includes("פאי")||d.location.includes("בנגקוק →");
    if (state.filter==="קוסמוי") return d.location.includes("קוסמוי")||d.location.includes("קופנגן")||d.location.includes("מעבר לקוסמוי");
    if (state.filter==="פטאיה") return d.location.includes("פטאיה");
    if (state.filter==="בנגקוק") return d.location.includes("בנגקוק")||d.location.includes("המראה")||d.location.includes("מעבר לבנגקוק");
    return true;
  });

  return `<div class="section">
    <div class="filter-row">
      ${filterGroups.map(f => {
        const key = f==="הכל"?"all":f;
        return `<button class="filter-btn ${state.filter===key?'active':''}" onclick="setFilter('${key}')">${f}</button>`;
      }).join("")}
    </div>
    ${filtered.map(item => {
      if (state.editingDay===item.date) return renderEditDay(item);
      return `
      <div class="card ${item.tbd?'tbd':''}">
        <div class="row-between">
          <div style="flex:1">
            <div class="row" style="gap:8px;margin-bottom:4px">
              <span class="badge badge-red">${item.date}</span>
              <span class="text-gray text-sm">${item.day}</span>
              ${item.tbd?'<span class="badge badge-orange">TBD</span>':''}
            </div>
            <div class="day-loc">${item.location}</div>
            <div class="day-content">${item.content}</div>
          </div>
          <button class="edit-btn" onclick="startEdit('${item.date}')">✏️</button>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

function renderEditDay(item) {
  return `
  <div class="card highlight">
    <div class="row-between mb8">
      <span class="badge badge-red">${item.date} — ${item.day}</span>
      <label style="color:#f4a261;font-size:12px;display:flex;gap:6px;align-items:center">

      <button class="btn-secondary" onclick="cancelEdit()">ביטול</button>
    </div>
  </div>`;
}

    <div class="section-tabs">
      ${sections.map(([id,label]) => `
        <button class="filter-btn ${state.bookingSection===id?'active':''}" onclick="setBookingSection('${id}')">${label}</button>
      `).join("")}
    </div>
    ${content}
  </div>`;
}

// ── CONTACTS ──
function renderContacts() {
  return `<div class="section">
    ${CONTACTS.map(c => `
    <div class="card">
      <div class="contact-card">
        <span class="contact-emoji">${c.emoji}</span>
        <div style="flex:1">
          <div class="text-blue bold" style="font-size:15px">${c.name}</div>
          <div class="text-gray text-sm mt4">${c.role}</div>
          <a href="tel:${c.phone}" class="phone-link">${c.phone}</a>
        </div>
        <a href="tel:${c.phone}" class="call-btn">📞</a>
      </div>
    </div>`).join("")}
  </div>`;
}

// ── EXPENSES ──
function renderExpenses() {
  const categories = ["אוכל","תחבורה","קניות","אטרקציות","אחר"];
  const total = state.expenses.reduce((s,e) => s+e.amount, 0);
  const byCat = categories.map(c => ({cat:c, total:state.expenses.filter(e=>e.category===c).reduce((s,e)=>s+e.amount,0)})).filter(x=>x.total>0);

  const list = [...state.expenses].reverse().map(e => `
    <div class="card">
      <div class="row-between">
        <div>
          <div class="bold">${e.name}</div>
          <div class="text-gray text-xs mt4">${e.category} • ${e.date}${e.note?' • '+e.note:''}</div>
        </div>
        <div class="row" style="gap:10px">
          <span class="text-orange bold">${e.amount.toLocaleString()} ₪</span>
          <button style="background:transparent;border:none;color:#8888aa;cursor:pointer;font-size:16px" onclick="deleteExpense(${e.id})">🗑️</button>
        </div>
      </div>
    </div>`).join("") || `<div class="empty-state">עוד אין הוצאות 💸</div>`;

  return `<div class="section">
    <div class="card highlight" style="margin-bottom:16px">
      <div class="text-gray text-sm">סה"כ הוצאות</div>
      <div class="text-orange bold" style="font-size:28px">${total.toLocaleString()} ₪</div>
      ${byCat.length ? `<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">
        ${byCat.map(b=>`<span class="badge" style="background:#2d2d4e;color:#ccc">${b.cat}: ${b.total.toLocaleString()} ₪</span>`).join("")}
      </div>` : ""}
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="text-blue bold mb12">הוסף הוצאה</div>
      <input class="input" id="exp-name" placeholder="שם / תיאור" value="${state.expName}" oninput="state.expName=this.value">
      <div class="row mb8">
        <input class="input" id="exp-amount" type="number" placeholder="סכום ₪" value="${state.expAmount}" oninput="state.expAmount=this.value" style="margin-bottom:0;flex:1">
        <select class="select" id="exp-cat" onchange="state.expCategory=this.value" style="flex:1">
          ${categories.map(c=>`<option ${state.expCategory===c?'selected':''}>${c}</option>`).join("")}
        </select>
      </div>
      <input class="input" id="exp-note" placeholder="הערה (אופציונלי)" value="${state.expNote}" oninput="state.expNote=this.value">
      <button class="btn-primary" style="width:100%" onclick="addExpense()">+ הוסף</button>
    </div>
    ${list}
  </div>`;
}

// ── BUDGET ──
function renderBudget() {
  if (!state.budgetUnlocked) {
    return `<div class="lock-screen">
      <span style="font-size:48px">🔒</span>
      <div class="text-blue bold" style="font-size:18px">אזור פרטי</div>
      <div class="text-gray text-sm">הכנס סיסמה לצפייה בתקציב</div>
      <input type="password" class="input" id="budget-pw" placeholder="סיסמה" style="width:200px;text-align:center;direction:ltr"
        onkeydown="if(event.key==='Enter')tryUnlock()" oninput="state.budgetPw=this.value;state.budgetErr=false">
      ${state.budgetErr ? '<div class="text-red text-sm">סיסמה שגויה</div>' : ''}
      <button class="btn-primary" onclick="tryUnlock()">כניסה</button>
    </div>`;
  }

  const totalExp = state.expenses.reduce((s,e)=>s+e.amount,0);
  const remaining = TOTAL_BUDGET - APPROVED_SPEND - totalExp;
  const pct = Math.min(100, Math.round(((APPROVED_SPEND+totalExp)/TOTAL_BUDGET)*100));

  const rows = [
    {label:"טיסות", amount:31049, color:"#a8dadc"},
    {label:"מלונות", amount:21504, color:"#a8dadc"},
    {label:'טיול פאי (שייקה)', amount:3250, color:"#a8dadc"},
    {label:'סה"כ מאושר', amount:APPROVED_SPEND, color:"#f4a261", bold:true},
    {label:"הוצאות בטיול", amount:totalExp, color:"#ff6b6b"},
    {label:"יתרה", amount:remaining, color:remaining>0?"#52b788":"#e63946", bold:true},
  ];

  return `<div class="section">
    <div class="card highlight" style="margin-bottom:12px">
      <div class="text-gray text-sm">תקציב כולל</div>
      <div class="bold" style="font-size:24px">${TOTAL_BUDGET.toLocaleString()} ₪</div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${pct}%;background:${pct>85?'#e63946':'#2d6a4f'}"></div>
      </div>
      <div class="text-gray" style="font-size:12px;margin-top:6px">${pct}% נוצל</div>
    </div>
    ${rows.map(r=>`
      <div class="card">
        <div class="row-between">
          <span style="color:${r.bold?'#fff':'#ccc'};font-weight:${r.bold?'bold':'normal'}">${r.label}</span>
          <span style="color:${r.color};font-weight:bold">${r.amount.toLocaleString()} ₪</span>
        </div>
      </div>`).join("")}
    <button class="btn-secondary" style="margin-top:8px" onclick="state.budgetUnlocked=false;render()">🔒 נעל</button>
  </div>`;
}

// ── ALBUM ──
function renderAlbum() {
  const list = state.album.map(a => `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:32px">📸</span>
        <div style="flex:1">
          <div class="text-blue bold mb8">${a.label}</div>
          <a href="${a.url}" target="_blank" style="color:#e63946;font-size:13px;text-decoration:none">פתח אלבום ←</a>
        </div>
        <button style="background:transparent;border:none;color:#8888aa;cursor:pointer;font-size:16px" onclick="deleteAlbum(${a.id})">🗑️</button>
      </div>
    </div>`).join("") || `<div class="empty-state">📷<br>עוד אין אלבומים<br><span style="font-size:13px">הוסף לינק לגוגל פוטוס למעלה</span></div>`;

  return `<div class="section">
    <div class="card" style="margin-bottom:16px">
      <div class="text-blue bold mb12">הוסף אלבום</div>
      <input class="input" id="album-label" placeholder="שם האלבום (למשל: צ'אנג מאי)" value="${state.albumLabel}" oninput="state.albumLabel=this.value">
      <input class="input" id="album-url" placeholder="לינק לגוגל פוטוס" value="${state.albumUrl}" oninput="state.albumUrl=this.value" style="direction:ltr">
      <button class="btn-primary" style="width:100%" onclick="addAlbum()">+ הוסף אלבום</button>
    </div>
    ${list}
  </div>`;
}

// ═══════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════
function switchTab(tab) { state.activeTab=tab; state.editingDay=null; render(); }
function setFilter(f) { state.filter=f; render(); }
function setBookingSection(s) { state.bookingSection=s; render(); }

function startEdit(date) {
  const item = state.itinerary.find(d=>d.date===date);
  state.editingDay = date;
  state.editVal = {location:item.location, content:item.content, tbd:item.tbd};
  render();
  setTimeout(()=>{
    const loc = document.getElementById("edit-loc");
    const con = document.getElementById("edit-content");
    if(loc) loc.value = state.editVal.location;
    if(con) con.value = state.editVal.content;
  },50);
}

function cancelEdit() { state.editingDay=null; render(); }

function toggleTbd() {
  const cb = document.getElementById("edit-tbd");
  if(cb) state.editVal.tbd = cb.checked;
}

function saveEdit(date) {
  const loc = document.getElementById("edit-loc");
  const con = document.getElementById("edit-content");
  const tbd = document.getElementById("edit-tbd");
  if(loc) state.editVal.location = loc.value;
  if(con) state.editVal.content = con.value;
  if(tbd) state.editVal.tbd = tbd.checked;
  state.itinerary = state.itinerary.map(d => d.date===date ? {...d,...state.editVal} : d);
  state.editingDay = null;
  saveLocal();
  render();
}

function addExpense() {
  const name = document.getElementById("exp-name")?.value || state.expName;
  const amount = parseFloat(document.getElementById("exp-amount")?.value || state.expAmount);
  const cat = document.getElementById("exp-cat")?.value || state.expCategory;
  const note = document.getElementById("exp-note")?.value || state.expNote;
  if (!name || !amount) return;
  state.expenses.push({id:Date.now(), name, amount, category:cat, note, date:new Date().toLocaleDateString("he-IL")});
  state.expName=""; state.expAmount=""; state.expNote="";
  saveLocal(); render();
}

function deleteExpense(id) {
  state.expenses = state.expenses.filter(e=>e.id!==id);
  saveLocal(); render();
}

function tryUnlock() {
  const pw = document.getElementById("budget-pw")?.value || state.budgetPw;
  if (pw===BUDGET_PASSWORD) { state.budgetUnlocked=true; state.budgetErr=false; }
  else { state.budgetErr=true; }
  render();
}

function addAlbum() {
  const url = document.getElementById("album-url")?.value || state.albumUrl;
  const label = document.getElementById("album-label")?.value || state.albumLabel || "אלבום תמונות";
  if (!url) return;
  state.album.push({id:Date.now(), url, label});
  state.albumUrl=""; state.albumLabel="";
  saveLocal(); render();
}

function deleteAlbum(id) {
  state.album = state.album.filter(a=>a.id!==id);
  saveLocal(); render();
}

function attachListeners() {}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
window.addEventListener("DOMContentLoaded", () => {
  loadLocal();
  document.getElementById("loading").style.display="none";
  const app = document.getElementById("app");
  app.innerHTML = "";
  render();
});
</script>
</body>
</html>
